# ==============================================================================
# Modo DESENVOLVIMENTO — Postgres + Next.js com hot reload (modelo: matilha-app).
#
#   docker compose up
#
# O código-fonte é montado por volume (não fica preso dentro da imagem), então
# editar arquivos no host reflete direto no container, como rodar localmente.
#
# Não existe compose de produção: o deploy é só na Vercel (ver
# docs/deploy-producao.md).
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: caixa_comum
    ports:
      - "5432:5432"
    volumes:
      - caixa_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/caixa_comum?schema=public
      # Sem pooler em dev — DIRECT_URL (usada só por `prisma migrate`) é
      # sempre igual a DATABASE_URL aqui. Ver prisma/schema.prisma.
      DIRECT_URL: postgresql://postgres:postgres@db:5432/caixa_comum?schema=public
      # Datas de lançamento são do calendário de America/Sao_Paulo — o
      # Dockerfile.dev já fixa o fuso; repetido aqui como documentação.
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    # Sem `prisma generate` aqui enquanto o schema não tiver models (o Prisma
    # 5 recusa gerar sem nenhum) — volta na change usuarios-e-grupos.
    command: npm run dev

  # Interface web para consultar/editar os dados do Postgres.
  # Acesse em http://localhost:5050 (login: admin@admin.com / admin).
  # Ao adicionar um servidor lá dentro, use host "db", porta 5432,
  # usuário "postgres", senha "postgres", database "caixa_comum".
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - caixa_pgadmin_dev:/var/lib/pgadmin

volumes:
  caixa_pgdata_dev:
  caixa_pgadmin_dev:
